    <!-- Fonts are requested here, from the HTML, so the browser discovers them at once
         instead of after it has downloaded and parsed the CSS bundle (whose own import
         of this same URL then hits cache). Shortens the window in which the header
         renders in the wider system fallback font. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800;900&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&family=JetBrains+Mono:wght@400;500&display=swap" />

    <!--
      Two rules for whoever edits this file next:

      1. Never write a tag name in angle brackets anywhere in this file, even inside
         a comment. scripts/prerender.mjs rewrites this file with plain regexes at
         build time; a tag name in a comment matches those regexes and the replacement
         eats everything up to the real closing tag.

      2. Do not scope styles to the first div inside #root. React's root element is
         also a direct div child of #root, so such a rule outranks the Tailwind
         text utilities and repaints every link in the live app.
    -->
    <style>html, body { height: 100%; margin: 0; background: #09090b; } #root { height: 100%; } .prerender { visibility: hidden; font-family: sans-serif; max-width: 820px; margin: 0 auto; padding: 32px 20px; color: #d4d4d8; } .prerender a { color: #f59e0b; }</style>
    <noscript><style>.prerender { visibility: visible; }</style></noscript>

  </head>

  </body>
